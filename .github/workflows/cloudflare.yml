# 备用部署通道：由 GitHub Actions 构建，再把产物交给 Cloudflare 发布。
#
# 为什么需要它：Cloudflare 自己的构建系统（Workers Builds）会报
# "An internal error occurred"，那是对方构建环境的问题，改配置解决不了。
# 而 GitHub Actions 这边已经稳定跑通整套构建（含高德 Key 注入），
# 所以把构建留在 GitHub 侧、只让 Cloudflare 接收产物，就能绕开对方构建环境。
#
# 启用条件：在仓库 Settings → Secrets and variables → Actions 里配置下面两个值，
#          本工作流才会真正执行；没配置时只输出一条提示并跳过，
#          不会影响 GitHub Pages 那条部署流程。
#   CLOUDFLARE_API_TOKEN  —— Cloudflare 控制台 → My Profile → API Tokens →
#                            需要 Account → Workers Scripts → Edit 权限
#   CLOUDFLARE_ACCOUNT_ID —— Cloudflare 控制台 → Workers & Pages 页面右侧的 Account ID
#
# 停用方式：删除本文件，或删除上面两个 Secret。

name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: 检查 Cloudflare 凭据是否已配置
        id: creds
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 CLOUDFLARE_API_TOKEN，跳过 Cloudflare 部署"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create AMAP config from secret
        if: steps.creds.outputs.ready == 'true'
        run: |
          cp 网页代码/amap/config.example.js 网页代码/amap/config.js
          sed -i "s/YOUR_AMAP_API_KEY_HERE/${{ secrets.AMAP_KEY }}/g" 网页代码/amap/config.js
        shell: bash

      # 不设 BASE_URL：Cloudflare 服务在根路径下
      - name: Build
        if: steps.creds.outputs.ready == 'true'
        run: npm install && npm run build
        working-directory: 网页代码

      # 校验令牌可用性，并把账号表写成注解，便于直接在运行摘要里看到
      - name: 检查 Cloudflare 凭据可用性
        if: steps.creds.outputs.ready == 'true'
        working-directory: 网页代码
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          out=$(npx --yes wrangler@4 whoami 2>&1)
          echo "$out"
          one=$(printf '%s' "$out" | tr '\n' ' ' | tr -s ' ' | cut -c1-900 | sed 's/%/%25/g')
          echo "::warning title=wrangler whoami::$one"

      # 直接调用 wrangler，并把真实报错原文写成 error 注解
      # （cloudflare/wrangler-action 会吞掉 wrangler 的错误详情）
      #
      # 账号 ID 用令牌自己查，不读 CLOUDFLARE_ACCOUNT_ID Secret：
      # 手抄 32 位 Account ID 很容易少几位，那会让 API 报 code 7003
      # "object identifier is invalid"。查不到就留给 wrangler 自行选择。
      - name: Deploy to Cloudflare Workers
        if: steps.creds.outputs.ready == 'true'
        working-directory: 网页代码
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          acct=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=50" \
            | grep -oE '"id": *"[0-9a-f]{32}"' | head -1 | grep -oE '[0-9a-f]{32}')
          if [ -n "$acct" ]; then
            echo "自动解析到账号 ID，尾四位：${acct: -4}"
            export CLOUDFLARE_ACCOUNT_ID="$acct"
            echo "::notice title=账号 ID::自动解析到 ${acct:0:6}…${acct: -4}"
          else
            echo "未能自动解析账号 ID，交给 wrangler 自行选择账号"
          fi

          npx --yes wrangler@4 deploy 2>&1 | tee wrangler-deploy.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            one=$(tail -c 900 wrangler-deploy.log | tr '\n' ' ' | tr -s ' ' | sed 's/%/%25/g')
            echo "::error title=wrangler deploy 失败::$one"
          fi
          exit "$code"
