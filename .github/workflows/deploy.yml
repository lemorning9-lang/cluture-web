name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create AMAP config from secret
        run: |
          cp 网页代码/高德api/config.example.js 网页代码/高德api/config.js
          sed -i "s/YOUR_AMAP_API_KEY_HERE/${{ secrets.AMAP_KEY }}/g" 网页代码/高德api/config.js
        shell: bash

      - name: Install dependencies
        run: npm install
        working-directory: 网页代码

      - name: Build
        run: npm run build
        working-directory: 网页代码
        env:
          BASE_URL: /${{ github.event.repository.name }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 网页代码/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4